<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forecasting Mutual Funds</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/stayles.css') }}">
    <style>
        .dashboard-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .form-section {
            flex-shrink: 0;
        }

        .results-section {
            flex: 1;
            overflow: hidden;
            padding-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <!-- Header -->
        <header>
            <div class="header">
                <a class="logo">📊 Forecasting Mutual Funds</a>
                <div class="header-right">
                    <a href="/">Home</a>
                    <a href="https://github.com/NayakwadiS" target="_blank">Contact</a>
                    <a href="https://github.com/NayakwadiS/Forecasting_Mutual_Funds" target="_blank">About</a>
                </div>
            </div>
        </header>

        <!-- Form Section -->
        <div class="form-section">
            <div class="center" style="max-width: 1200px; margin: 8px auto; padding: 0 20px;">
                <form class="form-inline" method="POST" action="/">
                    <div>
                        <h2 style="color: #333; margin-bottom: 4px; text-align: center; font-size: 20px;">Select Mutual Fund & Algorithm</h2>
                        <p style="text-align: center; color: #666; font-size: 13px;">
                            Enter scheme code and choose an algorithm for 30-day forecasting
                        </p>
                    </div>

                    <div style="display: flex; gap: 15px; flex-wrap: wrap; align-items: flex-end;">
                        <div class="form-group" style="flex: 1; min-width: 200px;">
                            <label for="scheme">Scheme Code</label>
                            <input
                                id="scheme"
                                type="text"
                                placeholder="e.g., 0P0000XVJQ"
                                name="scheme"
                                required
                            >
                        </div>

                        <div class="form-group" style="flex: 1; min-width: 200px;">
                            <label for="type">Algorithm</label>
                            <select name="type" id="type" required>
                                <option value="">-- Select --</option>
                                <option value="Linear">Linear Regression</option>
                                <option value="Auto Regression">Auto Regression</option>
                                <option value="ARIMA">ARIMA</option>
                                <option value="LSTM">LSTM Neural Network</option>
                            </select>
                        </div>

                        <button type="button" onclick="show_plot()" style="flex: 0 1 auto; padding: 10px 20px; margin: 0;">Generate</button>
                    </div>

                    <div id="error"></div>
                </form>

                <div class="loader" id="loader" style="margin-top: 6px;"></div>
            </div>
        </div>

        <!-- Results Section -->
        <div class="results-section">
            <div class="center" style="max-width: 1200px; margin: 0 auto; padding: 0 20px;">
                <div id="data"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    <script type="text/javascript">
        window.onload = function() {
            document.getElementById("loader").classList.remove("active");
            document.getElementById("error").style.display = "none";
        };
    </script>
</body>
</html>
